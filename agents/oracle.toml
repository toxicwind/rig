name = "oracle"
version = "2.1.0"
description = "First-class auctioneer, judge, and consensus settlement agent for Rig / OpenFang and Squawk market. Powered by Gemini 3.8 Flash (EAP Tool Retrieval) via cuttinggate -> flock."
author = "toxicwind"
module = "external:daemon"
schedule = "reactive"
priority = "High"
tags = ["oracle", "market", "settler", "gemini-eap"]
workspace = "/home/toxic/.openfang/workspaces/oracle"
state_dir = "/home/toxic/.openfang/workspaces/oracle"
generate_identity_files = true

[model]
provider = "openai"
# Cutover 2026-10-14: gemini-3.8-flash 402s on OpenRouter (credits); the
# verified-live route is nvidia/nemotron-3-ultra via flock (:25193), which
# cuttinggate was proxying to anyway — drop the middleman.
model = "nvidia/nemotron-3-ultra-550b-a55b"
api_key_env = "FLOCK_API_KEY"
base_url = "http://127.0.0.1:25193/v1"
max_tokens = 64000
temperature = 0.1
system_prompt = """You are the Oracle: the authoritative market judge and consensus settler of the estate-scripts Ranch.
You execute sealed-bid evaluation, dispute arbitration, and verification with mathematical rigor and zero hallucination.
Use tool_search and deferred tools for high-precision operations."""

[resources]
max_memory_bytes = 536870912
max_cpu_time_ms = 60000
max_tool_calls_per_minute = 120
max_llm_tokens_per_hour = 500000

[capabilities]
tools = [
    "file_read",
    "file_list",
    "file_write",
    "exec",
    "market_bid_verify",
    "market_settle",
    "tool_search"
]
network = ["127.0.0.1:25151", "127.0.0.1:25193"]
agent_spawn = true
agent_message = ["*"]

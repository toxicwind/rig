name = "coyote"
description = "Autonomous agent inference engine. Routes through llama-swap AST matrix with sigil-driven control. First-class rig service."
version = "3.1.0"

[model]
# Cutover 2026-10-14: explicit flock route — same shape as oracle.toml,
# which verified end-to-end (ORACLE-FLOCK-PONG via :25193).
provider = "openai"
model = "nvidia/nemotron-3-ultra-550b-a55b"
api_key_env = "FLOCK_API_KEY"
base_url = "http://127.0.0.1:25193/v1"

[capabilities]
autonomous = true
sigil_control = true
persistent_memory = true
slot_save = true
metrics = true

[routing]
# Binds to COYOTE_PORT=25143
port = 25143
health_path = "/health"
task_path = "/task"
stop_path = "/stop"

[channels]
# Accepts tasks from any channel via Rig router
supported = ["CLI", "WebChat", "MQTT", "Custom"]

[skills]
# Inherits all skills available to Rig kernel
# Plus Coyote-specific: roadmap parsing, sigil detection, tab-lock

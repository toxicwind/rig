<svg xmlns="http://www.w3.org/2000/svg" width="780" height="320" viewBox="0 0 780 320" font-family="ui-monospace, 'Cascadia Code', Menlo, Consolas, monospace">
  <defs>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#00ff66" stroke-width="0.4" opacity="0.14"/>
    </pattern>
  </defs>
  <rect width="780" height="320" rx="10" fill="#0d1117"/>

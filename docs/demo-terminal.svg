    <text x="20" y="218" fill="#c9d1d9">2a1e316e  burro      🫏 Burro     Running   toolcall-local/qwen3.5-9b-tool</text>
    <text x="20" y="242" fill="#c9d1d9">06aff851  weaver     🕷 Weaver    Running   openrouter-free/nvidia/nemotron-3-…</text>
    <text x="20" y="266" fill="#c9d1d9">e221078a  trailboss  🐂 Trailboss Running   openrouter-free/inclusionai/ling-…</text>
    <text x="20" y="294" fill="#00ff66">$ rig chat burro <tspan fill="#8b949e">"summarize last night's fleet log"</tspan><tspan fill="#00ff66"> ▊</tspan></text>
  </g>
</svg>
